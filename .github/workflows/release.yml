name: Release

# Each new versionName (app/build.gradle.kts) on main builds the APK and publishes it as a
# GitHub release v<versionName> (the tag is made here, on GitHub). Can also be run by hand.
on:
  push:
    branches: [main]
    paths: ['app/build.gradle.kts', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # The release key, if the repository has it as secrets (Settings → Secrets → Actions):
      # RELEASE_KEYSTORE (the .jks in base64), RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      - name: Release key
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE }}
          SP: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KA: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SP" "$KA" "$KP" > keystore.properties
          fi
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest
      - name: APK
        id: apk
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "BinelikAI-$v.apk"
          # The same APK under a fixed name, for the «Download APK» button (releases/latest/download/BinelikAI.apk).
          cp app/build/outputs/apk/release/app-release.apk BinelikAI.apk
          # R8 mapping, to read the crash reports (the code is open source anyway).
          cp app/build/outputs/mapping/release/mapping.txt "BinelikAI-$v-mapping.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Binelik AI ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            BinelikAI-${{ steps.apk.outputs.version }}.apk
            BinelikAI.apk
            BinelikAI-${{ steps.apk.outputs.version }}-mapping.txt
          body_path: docs/RELEASE.md
          # Not a pre-release, so that «latest» (the README button and the app's update check) finds it.
          prerelease: false
          make_latest: true
      # The Google Play bundle (build type "play": no self-update, no «Our other apps», 🚩 under AI replies), same
      # key and versionCode. Built after the GitHub release, so a problem here never holds the release back.
      # Downloaded from the run's artifacts and uploaded to Play by hand; the mapping goes to Play Console with it.
      - name: Play bundle (AAB)
        id: aab
        run: |
          ./gradlew :app:bundlePlay
          cp app/build/outputs/bundle/play/app-play.aab "BinelikAI-${{ steps.apk.outputs.version }}-play.aab"
          cp app/build/outputs/mapping/play/mapping.txt "BinelikAI-${{ steps.apk.outputs.version }}-play-mapping.txt"
      - uses: actions/upload-artifact@v5
        with:
          name: BinelikAI-${{ steps.apk.outputs.version }}-play
          path: |
            BinelikAI-${{ steps.apk.outputs.version }}-play.aab
            BinelikAI-${{ steps.apk.outputs.version }}-play-mapping.txt
          retention-days: 7
